[package]
edition = "2024"
rust-version = "1.88"
name = "bolke-recorder"
version = "0.1.1"
build = false
autolib = false
autobins = false
description = "Cross-platform microphone capture: exact, ordered, framed audio on an ordinary thread."
keywords = [
    "audio",
    "microphone",
    "recording",
    "capture",
    "speech",
]
categories = ["multimedia::audio"]
license = "MIT"

[features]
test-backend = []

[lib]
name = "bolke_recorder"
path = "src/lib.rs"

[dependencies.dasp_sample]
version = "0.11"

[dependencies.log]
version = "0.4"

[dependencies.rtrb]
version = "0.4.0"

[dependencies.rubato]
version = "=5.0.0"

[target.'cfg(not(target_os = "linux"))'.dependencies.cpal]
version = "=0.18.2"
package = "bolke-cpal"
path = "../bolke-cpal"

[target.'cfg(target_os = "linux")'.dependencies.cpal]
version = "=0.18.2"
features = ["pulseaudio"]
package = "bolke-cpal"
path = "../bolke-cpal"

[target.'cfg(target_os = "linux")'.dependencies.futures]
version = "0.3"
features = ["executor"]
default-features = false

[target.'cfg(target_os = "linux")'.dependencies.libc]
version = "0.2"

[target.'cfg(target_os = "linux")'.dependencies.pulseaudio]
version = "0.3"

[target.'cfg(target_os = "macos")'.dependencies.objc2-av-foundation]
version = "0.3.2"
features = [
    "std",
    "AVCaptureDevice",
    "AVMediaFormat",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-audio]
version = "0.3.2"
features = [
    "std",
    "AudioHardware",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = [
    "std",
    "CFString",
]
default-features = false

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.62"
features = ["Win32_System_Registry"]
